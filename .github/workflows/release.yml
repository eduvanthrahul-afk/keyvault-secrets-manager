name: Release
# Push a tag like v2.0.0 to publish:
#   - the Docker image  ghcr.io/<owner>/<repo>:2.0.0 and :latest (amd64 + arm64)
#   - a GitHub Release with install.sh, the self-host bundle and the kv CLI
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:cli
      - name: Assemble release assets
        run: |
          mkdir -p out
          sed "s/__KEYVAULT_VERSION__/${GITHUB_REF_NAME}/" deploy/install.sh > out/install.sh
          cp deploy/docker-compose.yml deploy/Caddyfile out/
          cp apps/cli/dist/kv.mjs out/kv.mjs
          (cd apps/cli && npm pack --pack-destination ../../out) && mv out/keyvault-cli-*.tgz out/keyvault-cli.tgz
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Self-host in one command

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | bash
          \`\`\`

          Docker image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`

          ## CLI

          \`\`\`bash
          npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/keyvault-cli.tgz
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --title "KeyVault $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
