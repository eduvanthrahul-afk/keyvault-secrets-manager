name: CI
on:
  push:
    branches: [main, v2-redesign]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build:cli

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify
        working-directory: apps/server

  e2e:
    name: end-to-end + browser tests
    runs-on: ubuntu-latest
    needs: [typescript, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: npm ci
      - run: npm run build:web && npm run build:cli
      # Plain-HTTP CI server: headless Chromium on Linux won't store Secure/__Host- cookies over
      # http://localhost, so CI uses a plain cookie. Production (HTTPS) keeps __Host- + Secure.
      - name: Start server (embedded PostgreSQL)
        working-directory: apps/server
        run: |
          chmod +x mvnw
          nohup ./mvnw -q -B spring-boot:test-run -Dspring-boot.run.arguments="--keyvault.app-origin=http://localhost:8080 --keyvault.session.secure-cookie=false --keyvault.session.cookie-name=kv_session" > server.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - run: npm run e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            apps/server/server.log

  docker:
    runs-on: ubuntu-latest
    needs: [typescript, server]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t keyvault:ci .
