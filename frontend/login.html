<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KeyVault Pro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <main class="auth-card fade-in">
        <header style="text-align: center; margin-bottom: 2.5rem;">
            <div class="logo-container" style="justify-content: center; margin-bottom: 1.5rem;">
                <div class="app-logo" style="width: 48px; height: 48px;"></div>
            </div>
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome back</h1>
            <p class="text-muted">Enter your credentials to access your vault.</p>
        </header>

        <form id="login-form">
            <div class="form-group">
                <label for="email" class="label">Work Email</label>
                <input type="email" id="email" class="input" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" class="label" style="margin: 0;">Master Password</label>
                    <a href="#"
                        style="font-size: 0.75rem; color: var(--text-secondary); text-decoration: none;">Forgot?</a>
                </div>
                <input type="password" id="password" class="input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">
                Sign in to KeyVault
            </button>
        </form>

        <footer
            style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-base); padding-top: 2rem;">
            <p class="text-muted">Don't have an account? <a href="register.html"
                    style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one</a></p>
        </footer>
    </main>

    <script src="js/api.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
