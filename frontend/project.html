<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keys | KeyVault Pro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar" role="navigation" aria-label="Main Navigation">
            <div class="sidebar-logo" style="margin-bottom: 2rem;">
                <div class="logo-container">
                    <div class="app-logo"></div>
                    <span class="logo-text">KeyVault</span>
                </div>
            </div>

            <nav style="flex: 1;">
                <a href="dashboard.html" class="btn btn-ghost" style="width: 100%; justify-content: flex-start;">
                    <i class="fa-solid fa-grid-2"></i> Dashboard
                </a>
                <a href="teams.html" class="btn btn-ghost" style="width: 100%; justify-content: flex-start;">
                    <i class="fa-solid fa-users"></i> Teams
                </a>
            </nav>

            <div class="sidebar-footer" style="border-top: 1px solid var(--border-base); padding-top: 1.5rem;">
                <div id="user-info" style="margin-bottom: 1rem;">
                    <div id="user-email-display"
                        style="font-size: 0.825rem; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        user@example.com</div>
                </div>
                <button id="logout-btn" class="btn btn-ghost"
                    style="width: 100%; justify-content: flex-start; padding: 0.5rem 0;">
                    <i class="fa-solid fa-right-from-bracket"></i> Sign out
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="top-nav">
                <div style="flex: 1;">
                    <nav aria-label="Breadcrumb">
                        <ol
                            style="list-style: none; display: flex; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem;">
                            <li><a href="dashboard.html" style="color: inherit; text-decoration: none;">Projects</a>
                            </li>
                            <li>/</li>
                            <li style="color: var(--text-main); font-weight: 500;" id="project-name-display">Project
                                Name</li>
                        </ol>
                    </nav>
                </div>
            </header>

            <main class="content-area fade-in">
                <div
                    style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3rem;">
                    <div>
                        <div id="project-tag-display" class="badge badge-dev"
                            style="margin-bottom: 1rem; display: inline-block;">Production</div>
                        <h1 id="project-name-title" style="margin-bottom: 0.25rem;">Workspace Vault</h1>
                        <p class="text-muted">Direct interface to manage and rotate sensitive API credentials.</p>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button id="decrypt-all-btn" class="btn">
                            <i class="fa-solid fa-lock-open"></i> Unlock All
                        </button>
                        <button id="add-key-btn" class="btn btn-primary">
                            <i class="fa-solid fa-plus"></i> Add Secret Key
                        </button>
                    </div>
                </div>

                <div class="form-group" style="max-width: 400px; margin-bottom: 2rem; position: relative;">
                    <i class="fa-solid fa-magnifying-glass"
                        style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);"></i>
                    <input type="text" id="key-search" class="input" placeholder="Find key by name or provider..."
                        style="padding-left: 2.5rem;">
                </div>

                <!-- Keys List (Preserved ID) -->
                <div id="keys-container" class="keys-container">
                    <!-- JavaScript will inject .key-item tiles here -->
                    <div style="padding: 4rem; text-align: center; color: var(--text-tertiary);">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <p>Synchronizing with vault...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for New Key (Preserved IDs) -->
    <div class="modal-overlay" id="key-modal" role="dialog" aria-modal="true" aria-labelledby="key-modal-title">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="key-modal-title">Security Initialization</h2>
                <button id="close-key-modal" class="btn btn-ghost" style="padding: 0.5rem;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="key-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="key-name" class="label">Key Name</label>
                        <input type="text" id="key-name" class="input" placeholder="e.g. Stripe Secret" required>
                    </div>
                    <div class="form-group">
                        <label for="key-service" class="label">Provider</label>
                        <input type="text" id="key-service" class="input" placeholder="AWS, Stripe, etc." required>
                    </div>
                    <div class="form-group">
                        <label for="key-env" class="label">Environment</label>
                        <select id="key-env" class="input">
                            <option value="dev">Development</option>
                            <option value="test">Staging</option>
                            <option value="prod">Production</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="key-expiry" class="label">Expiry Date</label>
                        <input type="date" id="key-expiry" class="input">
                    </div>
                </div>
                <div class="form-group">
                    <label for="key-value" class="label">Secret Value</label>
                    <textarea id="key-value" class="input" style="font-family: var(--font-mono); min-height: 100px;"
                        placeholder="Paste secret here..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="key-notes" class="label">Administrative Notes</label>
                    <textarea id="key-notes" class="input" style="min-height: 60px;"
                        placeholder="Context, ownership, or rotation info..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" id="cancel-key" class="btn btn-ghost">Discard</button>
                    <button type="submit" id="save-key-btn" class="btn btn-primary">Encrypt & Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/project.js"></script>
</body>

</html>
