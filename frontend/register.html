<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | KeyVault Pro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <main class="auth-card fade-in" style="max-width: 440px;">
        <header style="text-align: center; margin-bottom: 2.5rem;">
            <div class="logo-container" style="justify-content: center; margin-bottom: 1.5rem;">
                <div class="app-logo" style="width: 48px; height: 48px;"></div>
            </div>
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Create your account</h1>
            <p class="text-muted">Start securing your API infrastructure today.</p>
        </header>

        <form id="register-form">
            <div class="form-group">
                <label for="email" class="label">Work Email</label>
                <input type="email" id="email" class="input" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label for="password" class="label">Master Password</label>
                <input type="password" id="password" class="input" placeholder="Create a strong password" required>
                <p style="font-size: 0.7rem; color: var(--text-tertiary); margin-top: 0.5rem;">Used for client-side
                    encryption.</p>
            </div>
            <div class="form-group">
                <label for="confirm-password" class="label">Confirm Master Password</label>
                <input type="password" id="confirm-password" class="input" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">
                Create Pro Account
            </button>
        </form>

        <footer
            style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-base); padding-top: 2rem;">
            <p class="text-muted">Already have an account? <a href="login.html"
                    style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in</a></p>
        </footer>
    </main>

    <script src="js/api.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
