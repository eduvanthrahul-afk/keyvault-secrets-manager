<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | KeyVault Pro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar" role="navigation" aria-label="Main Navigation">
            <div class="sidebar-logo" style="margin-bottom: 2rem;">
                <div class="logo-container">
                    <div class="app-logo"></div>
                    <span class="logo-text">KeyVault</span>
                </div>
            </div>

            <nav style="flex: 1;">
                <a href="dashboard.html" class="btn btn-ghost" style="width: 100%; justify-content: flex-start;">
                    <i class="fa-solid fa-grid-2"></i> Dashboard
                </a>
                <a href="teams.html" class="btn btn-ghost"
                    style="width: 100%; justify-content: flex-start; background: var(--bg-muted); color: var(--text-main);">
                    <i class="fa-solid fa-users"></i> Teams
                </a>
            </nav>

            <div class="sidebar-footer" style="border-top: 1px solid var(--border-base); padding-top: 1.5rem;">
                <div id="user-info" style="margin-bottom: 1rem;">
                    <div id="user-email-display"
                        style="font-size: 0.825rem; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        user@example.com</div>
                </div>
                <button id="logout-btn" class="btn btn-ghost"
                    style="width: 100%; justify-content: flex-start; padding: 0.5rem 0;">
                    <i class="fa-solid fa-right-from-bracket"></i> Sign out
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="top-nav">
                <div style="flex: 1;">
                    <nav aria-label="Breadcrumb">
                        <ol
                            style="list-style: none; display: flex; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem;">
                            <li>Organization</li>
                            <li>/</li>
                            <li style="color: var(--text-main); font-weight: 500;">Teams</li>
                        </ol>
                    </nav>
                </div>
            </header>

            <main class="content-area fade-in">
                <div style="margin-bottom: 3rem;">
                    <h1 style="margin-bottom: 0.25rem;">Team Management</h1>
                    <p class="text-muted">Manage shared access and administrative permissions across your workspaces.
                    </p>
                </div>

                <div class="form-group" style="max-width: 400px; margin-bottom: 2rem;">
                    <label for="project-selector" class="label">Select Workspace</label>
                    <select id="project-selector" class="input">
                        <option value="">Choose a workspace...</option>
                        <!-- Loaded via JS -->
                    </select>
                </div>

                <div id="members-section" style="display: none;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3>Active Members</h3>
                        <button id="add-member-btn" class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-plus"></i> Invite Member
                        </button>
                    </div>

                    <div id="members-list" class="keys-container">
                        <!-- Members go here -->
                    </div>
                </div>

                <div id="empty-state"
                    style="padding: 4rem; text-align: center; border: 1px dashed var(--border-base); border-radius: var(--radius-xl); opacity: 0.6;">
                    <div style="font-size: 2rem; margin-bottom: 1rem;">👥</div>
                    <h3 style="margin-bottom: 0.5rem;">Select a workspace</h3>
                    <p class="text-muted">Choose a workspace above to view and manage team members.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Invite Member Modal -->
    <div class="modal-overlay" id="invite-modal" role="dialog" aria-modal="true">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Invite to Workspace</h2>
                <button id="close-invite-modal" class="btn btn-ghost" style="padding: 0.5rem;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="invite-form">
                <div class="form-group">
                    <label for="invite-email" class="label">Work Email</label>
                    <input type="email" id="invite-email" class="input" placeholder="colleague@company.com" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" id="cancel-invite" class="btn btn-ghost">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send Invitation</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/teams.js"></script>
</body>

</html>
