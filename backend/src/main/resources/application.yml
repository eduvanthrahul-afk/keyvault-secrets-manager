spring:
  config:
    import: optional:file:./secrets.properties
  datasource:
    url: jdbc:mysql://localhost:3306/keyvault_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  cache:
    cache-names: notification_summary
    caffeine:
      spec: expireAfterWrite=300s,maximumSize=10000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutes

resend:
  api:
    key: ${RESEND_API_KEY} # Literal API Key removed
  from:
    email: onboarding@resend.dev # Sender Email
